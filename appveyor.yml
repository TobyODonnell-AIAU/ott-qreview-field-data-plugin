image: Visual Studio 2026

pull_requests:
  do_not_increment_build_number: true

platform: Any CPU
configuration: Release

shallow_clone: true
skip_tags: true

environment:
  GITHUB_AUTH_TOKEN:
    secure: a+daW6wCxNjiC19/k6jLSgweptfO1hx8779M6wDFPaEA/Hg14D6jVqMBw/mO27Sq

assembly_info:
  patch: true
  file: AssemblyInfo.*
  assembly_version: "{version}"
  assembly_file_version: "{version}"
  assembly_informational_version: "{version}"

init:
  - ps: |
      If (-Not $env:APPVEYOR_PULL_REQUEST_NUMBER) {
        $env:IS_NOT_PR = "true"
      }

before_build:
  - nuget restore src\QReviewPlugin.sln

build:
  project: src\QReviewPlugin.sln

artifacts:
  - path: src\QReview\deploy\Release\QReview.plugin
    name: ThePlugin
    type: file

  - path: src\QReview\deploy\Release\QReview-net10.plugin
    name: ThePlugin-net10
    type: file

deploy:
  - provider: GitHub
    tag: v$(APPVEYOR_BUILD_VERSION)
    release: OTT QReview field data plugin $(APPVEYOR_BUILD_VERSION)
    description: ''
    artifact: ThePlugin, ThePlugin-net10
    auth_token: $(GITHUB_AUTH_TOKEN)
    on:
      is_not_pr: true
